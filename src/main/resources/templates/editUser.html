<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/orders}">Orders</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a class="nav-link" th:href="@{/login}">Login</a>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a class="nav-link" th:href="@{/register}">Register</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/users}">User Admin</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

<div class="container" style="max-width: 480px;">
    <h1>Edit User</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}">
        Error message
    </div>

    <form th:action="@{/admin/users/edit}" method="post">
        <input type="hidden" name="id" th:value="${user.id}">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <p class="form-control-plaintext" th:text="${user.username}">username</p>
        </div>

        <div class="mb-3">
            <label class="form-label" for="role">Role</label>
            <select class="form-select" id="role" name="role">
                <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
            </select>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="enabled" name="enabled" value="true"
                   th:checked="${user.enabled}">
            <label class="form-check-label" for="enabled">Enabled</label>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-secondary" th:href="@{/admin/users}">Cancel</a>
    </form>
</div>

</body>
</html>
