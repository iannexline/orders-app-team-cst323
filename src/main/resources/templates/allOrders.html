<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/orders}">Orders</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a class="nav-link" th:href="@{/login}">Login</a>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
                <a class="nav-link" th:href="@{/register}">Register</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/users}">User Admin</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

<div class="container">
    <h1 th:text="${title}"></h1>
    <p>
        <a class="btn btn-primary" th:href="@{/orders/newOrder}">New Item</a>
    </p>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Id</th>
                <th>Order Number</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">Id</td>
                <td th:text="${order.order_number}">Order Number</td>
                <td th:text="${order.product_name}">Product Name</td>
                <td th:text="${order.price}">Price</td>
                <td th:text="${order.quantity}">Quantity</td>
                <td>
                    <a class="btn btn-primary" th:href="@{/orders/editOrder/{id}(id=${order.id})}">Edit</a>
                    <a class="btn btn-danger" th:href="@{/orders/deleteOrder/{id}(id=${order.id})}">Delete</a>
                    <a class="btn btn-info" th:href="@{/orders/showOrder/{id}(id=${order.id})}">Show</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
